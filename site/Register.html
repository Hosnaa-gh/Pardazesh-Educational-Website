    <div class="contentform">
        <br>
      <div class="bannerpage">
        <span>فرم ثبت نام</span>
      </div>

      <div class="boxpage">
        <form>
          <div>
            <br>
            <label for="name">نام و نام خانوادگی </label>
            <br>
            <input type="text" placeholder="نام خود را وارد نمایید" id="name">
          </div>
          <div>
            <label for="username">نام کاربری</label>
            <br>
            <input type="text" placeholder="نام کاربری را وارد نمایید" id="username">
          </div>
          <div>
            <label for="age">سن</label>
            <br>
            <input type="number" placeholder="سن را وارد نمایید" id="age" min="0">
          </div>
          <div>
            <label>جنسیت</label>
            <br>
            <select id="gender">
              <option class="select">انتخاب کنید</option>
              <option>مرد</option>
              <option>زن</option>
            </select>
          </div>

          <div>
              <label for="password">رمز عبور</label>
              <br>
              <input type="password" placeholder="رمز عبور را وارد نمایید" id="password">

          </div>

          <div>
            <label for="passconf">تکرار رمز عبور</label>
            <br>
            <input type="password" placeholder="مجددا رمز را وارد نمایید" id="passconf">
            <br>
            <span id="message"></span>
          </div>

          <div>
            <label for="email">ایمیل</label>
            <br>
            <input type="email" placeholder="ایمیل را وارد نمایید" id="email">
          </div>

          <div>
            <label for="description">توضیحات</label>
            <br>
            <textarea placeholder="توضیحات...." cols="21" rows="5" id="description"></textarea>

          </div>
        <button onclick="checkEmpty()" type="button">ثبت نام</button>
      <br>

        </form>
